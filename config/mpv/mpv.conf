# ==============================================================================
# MPV Configuration - Optimized for AMD Radeon & Hyprland
# ==============================================================================

# GPU Hardware Decoding
hwdec=auto
vo=gpu-next

# High Quality Video Rendering
profile=high-quality

# Window behavior
autofit-larger=85%x85%
cursor-autohide=1000
keep-open=yes

# Audio & Subtitles
volume=100
volume-max=150
sub-auto=fuzzy
slang=vi,en,vie,eng
alang=ja,jp,jpn,en,eng
