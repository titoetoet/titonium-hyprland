general {
    lock_cmd = qs -p /home/cole/Projects/titonium ipc call app prepareLock >/dev/null 2>&1 || true; logger -t titonium-lock "launch hyprlock"; pidof hyprlock || hyprlock --verbose 2>&1 | systemd-cat -t hyprlock
    on_lock_cmd = logger -t titonium-lock "session locked"
    on_unlock_cmd = logger -t titonium-lock "session unlocked"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

# 1. Release Titonium focus and lock the session after 5 minutes.
listener {
    timeout = 300                                 # 5 minutes of inactivity
    on-timeout = loginctl lock-session
}

# 2. Turn off displays only after hyprlock has already acquired the session lock.
listener {
    timeout = 330                                 # 5.5 minutes of inactivity
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

