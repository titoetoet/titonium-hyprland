# titonium hyprlock configuration
# Elegant, luxurious lock screen matching titonium palette

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 1
    no_fade_in = false
    no_fade_out = false
}

# 1. Background Blur & Tint
background {
    monitor =
    path = screenshot
    color = rgba(25, 17, 20, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.20
    vibrancy_darkness = 0.10
}

# 2. Big Editorial Time Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 223, 227, 0.95)
    font_size = 96
    font_family = SF Pro Display Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# 3. Date & Timezone Subtitle
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(215, 193, 198, 0.85)
    font_size = 16
    font_family = SF Pro Display Medium
    position = 0, 65
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.25)
}

# 4. Password Input Field (Pill shape with Rose/Peach Accent)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    rounding = 24
    outer_color = rgba(255, 180, 171, 0.40)
    inner_color = rgba(25, 17, 20, 0.65)
    font_color = rgba(240, 223, 227, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##d7c1c6"><i>Enter password...</i></span>
    hide_input = false
    check_color = rgba(255, 180, 171, 0.90)
    fail_color = rgba(255, 84, 73, 0.90)
    fail_text = <i>Authentication failed</i>
    fail_transition = 200

    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.30)
}

# 5. Bottom Status Label
label {
    monitor =
    text = titonium desktop
    color = rgba(215, 193, 198, 0.45)
    font_size = 11
    font_family = SF Pro Display
    position = 0, 30
    halign = center
    valign = bottom
}
